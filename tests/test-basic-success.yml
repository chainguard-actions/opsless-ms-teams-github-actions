name: Test basic success - MS Teams notification attempted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local webhook server
        run: |
          # Start a simple HTTP server that accepts POST and returns 200 OK
          python3 -c "
          import http.server, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST body:', body.decode('utf-8', errors='replace'), flush=True)
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'status': 'ok'}).encode())
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 9999), Handler)
          print('Webhook server listening on port 9999', flush=True)
          sys.stdout.flush()
          server.serve_forever()
          " &
          # Wait for the server to be ready
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:9999/ \
                -d '{}' -H 'Content-Type: application/json' 2>/dev/null | grep -q 200; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://localhost:9999/

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action may fail due to GitHub API limitations under act (e.g. invalid run_id),
          # but it must not be skipped — it must have attempted to run.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran (outcome: $OUTCOME)"
