name: Test pull request event notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_ACTOR: test-user
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_RUN_ID: "123456789"
      GITHUB_RUN_NUMBER: "42"
      GITHUB_WORKFLOW: "CI"
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run MS Teams notification action for pull request
        id: action
        continue-on-error: true
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-uri: https://example.webhook.office.com/webhookb2/00000000-0000-0000-0000-000000000000@00000000-0000-0000-0000-000000000000/IncomingWebhook/00000000000000000000000000000000/00000000-0000-0000-0000-000000000000
      - name: Assert action ran for pull request event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail with a network error (not a startup/config error)
          # Both 'success' and 'failure' are acceptable — 'skipped' would indicate a config problem
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME (network errors with mock webhook are expected)"
