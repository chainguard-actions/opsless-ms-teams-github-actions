name: Test invalid webhook URI causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable webhook URI and expect failure
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://127.0.0.1:19999/nonexistent-webhook
        continue-on-error: true

      - name: Assert action failed due to bad webhook or API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail either because:
          # 1. The webhook URI is unreachable (connection refused)
          # 2. The GitHub API call fails under act (invalid run_id)
          # In both cases, the action should report failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unreachable webhook, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome: $OUTCOME)"
