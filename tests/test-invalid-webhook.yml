name: Test invalid webhook URI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with unreachable webhook URI
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://127.0.0.1:19999/nonexistent-webhook

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the action always fails because the GitHub API call uses
          # an invalid run_id (act uses a placeholder). The action should fail
          # gracefully (not crash the runner) with outcome=failure.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (bad webhook or API error), but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly reported failure"
