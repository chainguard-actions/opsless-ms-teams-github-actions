name: Test invalid webhook URI error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid webhook URI
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-uri: "http://127.0.0.1:19999/nonexistent-webhook"

      - name: Assert action failed due to bad webhook URI or API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail — either because:
          # 1. The webhook URI is unreachable (connection refused)
          # 2. The GitHub API call fails (invalid run_id under act)
          # Both are valid failure modes for this test scenario
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid webhook URI, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome=failure)"
