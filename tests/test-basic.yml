name: Test basic push event notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "12345"
      GITHUB_RUN_NUMBER: "1"
      GITHUB_JOB: test
      GITHUB_WORKFLOW: "Test Workflow"
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_API_URL: https://api.github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action calls GitHub API and then the Teams webhook.
      # With a fake token the GitHub API will return 401, causing the action
      # to call core.setFailed. We use continue-on-error so we can assert
      # on the outcome rather than letting the job fail.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          webhook-uri: https://example.webhook.office.com/webhookb2/fake-webhook-uri

      - name: Assert action failed with expected GitHub API error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid GitHub API token, got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when GitHub API returned an error"
