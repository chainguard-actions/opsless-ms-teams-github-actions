name: Test basic usage - action runs and fails gracefully with mock inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          webhook-uri: https://example.webhook.office.com/webhookb2/fake-uri

      - name: Assert action ran and failed gracefully (not a crash)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the GitHub API token is fake
          # and the webhook URI is not real. What we verify is that the action
          # ran and produced a known outcome (failure), not an unexpected crash.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (graceful handling)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
