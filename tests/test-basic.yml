name: Test basic usage - push event notification
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: test-org/test-repo
      GITHUB_ACTOR: test-user
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
      GITHUB_WORKFLOW: Test Workflow
      GITHUB_RUN_ID: "123456789"
      GITHUB_RUN_NUMBER: "42"
      GITHUB_SERVER_URL: https://github.com
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run MS Teams notification action (expect failure with fake webhook)
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-uri: https://outlook.office.com/webhook/fake-test-webhook-uri/IncomingWebhook/fake/fake
        continue-on-error: true
      - name: Assert action ran (pass or fail with network error is acceptable)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: action did not run (outcome was '$OUTCOME')"
            exit 1
          fi
