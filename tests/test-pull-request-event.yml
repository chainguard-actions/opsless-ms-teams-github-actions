name: Test pull_request event scenario - action runs gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/1/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          webhook-uri: https://example.webhook.office.com/webhookb2/fake-uri

      - name: Assert action ran and failed gracefully for pull_request event
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because the GitHub API token is fake
          # and the webhook URI is not real. We verify the action completed
          # with a known outcome rather than crashing unexpectedly.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' for pull_request event"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
