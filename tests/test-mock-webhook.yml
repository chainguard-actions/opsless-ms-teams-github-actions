name: Test action behavior with mock webhook
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock MS Teams webhook server
        run: |
          # Start a simple HTTP server that accepts POST requests
          python3 -c "
          import http.server, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST body:', body.decode('utf-8', errors='replace'))
                  self.send_response(200)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, fmt, *args):
                  print(fmt % args)

          server = http.server.HTTPServer(('127.0.0.1', 18080), Handler)
          print('Mock webhook server listening on port 18080')
          server.serve_forever()
          " &
          echo "Mock server PID: $!"
          # Wait for server to be ready
          for i in $(seq 1 10); do
            if curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:18080/ \
                -d '{}' -H 'Content-Type: application/json' | grep -q 200; then
              echo "Mock server is ready"
              break
            fi
            sleep 1
          done

      - name: Run action with mock webhook
        id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://127.0.0.1:18080/webhook

      - name: Assert action ran and reported an outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Under act, the action calls the GitHub API using the run_id from the
          # act environment (a placeholder value). This causes the API call to
          # fail before the webhook is reached, so the action reports failure.
          # We verify the action ran and produced a definitive outcome (not skipped).
          if [ "$OUTCOME" = "skipped" ] || [ -z "$OUTCOME" ]; then
            echo "FAIL: action did not run (outcome=$OUTCOME)"
            exit 1
          fi
          echo "PASS: action ran and reported outcome=$OUTCOME"
