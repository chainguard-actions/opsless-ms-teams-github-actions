name: Test webhook failure - action fails on non-200 response or API error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start local webhook server that returns 500
        run: |
          # Start a simple HTTP server that returns 500 Internal Server Error
          python3 -c "
          import http.server, json, sys

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received POST body (will return 500):', body.decode('utf-8', errors='replace'), flush=True)
                  self.send_response(500)
                  self.send_header('Content-Type', 'application/json')
                  self.end_headers()
                  self.wfile.write(json.dumps({'error': 'Internal Server Error'}).encode())
              def log_message(self, fmt, *args):
                  pass

          server = http.server.HTTPServer(('0.0.0.0', 9998), Handler)
          print('Error webhook server listening on port 9998', flush=True)
          sys.stdout.flush()
          server.serve_forever()
          " &
          # Wait for the server to be ready
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:9998/ \
                -d '{}' -H 'Content-Type: application/json' 2>/dev/null | grep -q 500; then
              echo "Server is ready"
              break
            fi
            sleep 1
          done

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://localhost:9998/

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail: either because the webhook returns 500,
          # or because the GitHub API call fails under act (invalid run_id).
          # Either way, the outcome must be 'failure'.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (outcome: $OUTCOME)"
