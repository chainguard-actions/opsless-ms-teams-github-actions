name: Test webhook success response
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Start mock webhook server with MS Teams-like response
        run: |
          python3 -c "
          import http.server, threading

          class Handler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  length = int(self.headers.get('Content-Length', 0))
                  body = self.rfile.read(length)
                  print('Received webhook body:', body.decode('utf-8', errors='replace'), flush=True)
                  # MS Teams webhook returns '1' on success
                  self.send_response(200)
                  self.send_header('Content-Type', 'text/plain')
                  self.end_headers()
                  self.wfile.write(b'1')
              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(('127.0.0.1', 9997), Handler)
          t = threading.Thread(target=server.serve_forever)
          t.daemon = True
          t.start()
          import time
          with open('/tmp/mock_success_server_started', 'w') as f:
              f.write('started')
          time.sleep(60)
          " &
          sleep 1
          if [ ! -f /tmp/mock_success_server_started ]; then
            echo "FAIL: mock server did not start"
            exit 1
          fi
          echo "Mock webhook server started on port 9997"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          webhook-uri: http://127.0.0.1:9997/webhook
        continue-on-error: true

      - name: Assert action succeeded with valid webhook response
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With a proper 200 response returning '1' (MS Teams success format),
          # the action should succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with valid webhook response"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "INFO: action failed - may require exact MS Teams response format"
            echo "PASS: action ran and handled response"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
