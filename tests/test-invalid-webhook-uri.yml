name: Test invalid webhook URI - unreachable endpoint causes failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify port 19999 is not listening
        run: |
          if curl -sf --connect-timeout 2 http://127.0.0.1:19999/ > /dev/null 2>&1; then
            echo "WARNING: something is listening on port 19999, test may not be valid"
          else
            echo "Confirmed: nothing listening on port 19999"
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          # Point to a port that has nothing listening — connection refused
          webhook-uri: http://127.0.0.1:19999/webhook

      - name: Assert action failed as expected
        run: |
          OUTCOME="${{ steps.action.outcome }}"
          echo "action outcome: $OUTCOME"
          # The action should fail: either the GitHub API call fails (fake run_id under act)
          # or the webhook connection is refused. Either way, failure is expected.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when webhook URI is unreachable"
          else
            echo "FAIL: expected action to fail when webhook URI is unreachable"
            echo "actual outcome: $OUTCOME"
            exit 1
          fi
